/* u228: cursor-linked shared glow, scoped to existing menu/sidebar cards. */
.u228-host{--u228-highlight:rgba(132,94,247,.9);--u228-fill:rgba(132,94,247,.16);}
.u228-host > :is(.side,.boot-btn){position:relative;isolation:isolate;}
.u228-host > :is(.side,.boot-btn)::before,
.u228-host > :is(.side,.boot-btn)::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;transition:opacity .42s cubic-bezier(.2,.8,.2,1);
}
.u228-host > :is(.side,.boot-btn)::before{
  z-index:1;padding:1.5px;
  background:radial-gradient(160px circle at var(--u228-x,-500px) var(--u228-y,-500px),var(--u228-highlight),rgba(77,171,247,.44) 42%,transparent 72%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.u228-host > :is(.side,.boot-btn)::after{
  z-index:0;inset:1.5px;
  background:radial-gradient(220px circle at var(--u228-x,-500px) var(--u228-y,-500px),var(--u228-fill),transparent 63%);
}
.u228-host.u228-active > :is(.side,.boot-btn)::before,
.u228-host.u228-active > :is(.side,.boot-btn)::after{opacity:1}
body.light .u228-host{--u228-highlight:rgba(9,111,150,.92);--u228-fill:rgba(12,118,153,.13)}
.u228-host > :is(.side,.boot-btn):focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (hover:none){.u228-host > :is(.side,.boot-btn)::before,.u228-host > :is(.side,.boot-btn)::after{display:none}}
@media(prefers-reduced-motion:reduce){.u228-host > :is(.side,.boot-btn)::before,.u228-host > :is(.side,.boot-btn)::after{transition:none}}

/* Original: style_09.css */

/* Portraits are positioned against the actual bar-camera scene, not a small placeholder. */
.scene { height: 430px !important; }
.scene .counter { height: 80px; z-index: 3; }
.scene #figure {
  position: absolute !important;
  left: 50% !important;
  bottom: 80px !important;
  width: min(96%, 430px) !important;
  height: 340px !important;
  transform: translateX(-50%) !important;
  border: 0 !important;
  outline: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  opacity: 1 !important;
  padding: 0 !important;
  align-items: flex-end !important;
  justify-content: center !important;
  z-index: 2 !important;
}
.scene #figure img.guest-portrait {
  display: block !important;
  height: 100% !important;
  width: auto !important;
  max-width: 100% !important;
  object-fit: contain !important;
  object-position: bottom center !important;
  image-rendering: pixelated !important;
}
@media (max-width: 670px) {
 .scene { height: 310px !important; }
 .scene .counter { height: 55px; }
 .scene #figure { bottom: 55px !important; height: 245px !important; width: min(96%, 330px) !important; }
}

/* Original: style_10.css */

/* Desktop play canvas: deliberately narrower, centered within the panorama. */
@media (min-width: 671px) {
  .app { max-width: 980px !important; }
}
/* Center the portrait container geometrically inside the camera, regardless
   of older figure transforms and position rules. */
.scene #figure {
  left: 0 !important;
  right: 0 !important;
  margin-left: auto !important;
  margin-right: auto !important;
  transform: none !important;
}

/* Original: style_11.css */

/* Align the actual character frame to the midpoint of the bar-camera.
   Explicitly undo the older left/right auto-margin centering conflict. */
.scene #figure {
  left: 50% !important;
  right: auto !important;
  margin: 0 !important;
  transform: translateX(-50%) !important;
  width: min(96%, 420px) !important;
  height: 350px !important;
  bottom: 80px !important;
  display: flex;
  align-items: flex-end !important;
  justify-content: center !important;
}
.scene #figure img.guest-portrait {
  display: block !important;
  margin: 0 auto !important;
  height: 100% !important;
  width: auto !important;
  max-width: 100% !important;
  object-fit: contain !important;
  object-position: center bottom !important;
  transform: none !important;
}
@media (max-width: 670px) {
  .scene #figure { bottom: 55px !important; height: 245px !important; width: min(96%, 330px) !important; }
}

/* Original: style_12.css */

.v48-guest-symbol .mz-guest-face{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}

/* Original: style_13.css */

/* Scene-local layer order. Keep the solid bar front ABOVE the animated portrait.
   Explicit IDs override earlier versioned .figure/.counter rules. */
.scene {
  position: relative;
  isolation: isolate;
  overflow: hidden;
}
.scene #figure {
  z-index: 10 !important;
  /* Sit slightly behind the solid bar edge; no one-pixel seam on entry. */
  bottom: 74px !important;
}
.scene #counter {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 80px !important;
  z-index: 30 !important;
  background: var(--counter) !important;
  opacity: 1 !important;
  isolation: isolate;
}
/* Identity plate and other scene labels stay readable above the character. */
.scene .identity { z-index: 40; }
@media (max-width: 670px) {
  .scene #figure { bottom: 49px !important; }
  .scene #counter { height: 55px !important; }
}
/* DAY 17: compact layout only when a large order has five or more completed items. */
.scene #counter.mz-bulk-order{gap:6px!important;padding:3px 8px;justify-content:center;flex-wrap:wrap;align-content:center;overflow:hidden}
.scene #counter.mz-bulk-order .served{padding:2px 5px;font-size:10px;gap:3px;max-width:125px;min-width:0}

inbox.push(...[{"id":"day9","sender":"사장님","title":"메뉴 고르는 방법도 참 다양하지?","when":"prep","body":"좋은 저녁!\n\n오늘 낮에는 손님이 메뉴판을 한참 보시더니, 이름보다 맛부터 말씀하시더라. 달콤한 건 좋지만 시큼한 건 싫다나? 처음에는 내가 듣고도 조금 헷갈렸지 뭐니.\n\n손님들 취향이 제각각인 만큼 꼭 메뉴 이름만 외울 필요는 없겠지. 재료 도감에 적힌 맛과 향을 살펴보고 고르면 의외로 딱 맞는 걸 찾을 수도 있어.\n\n아, 관문 시장에 슈가 크리스털이라는 장식 재료도 새로 들어왔다더라. 반짝반짝한 게 꼭 작은 보석 같던데! 나중에 여유가 생기면 구경해 봐. 물론 필요한 물건부터 사는 게 우선이지만 말이야.\n\n그럼 오늘도 잘 부탁해. \n"},{"id":"closing9","sender":"사장님","title":"내일은 가게가 조금 달라질 거야","when":"closing","body":"오늘도 수고 많았어!\n\n낮에는 창고에 오래된 물건이 남아 있는지 살펴봤어. 가게에서 쓰던 제빙기가 가끔 말을 안 듣는다고 했잖니. 오븐도 오래 쓰다 보니 열 조절이 예전 같지 않고.\n\n그래서 둘 다 새 제품으로 바꾸기로 했어! 내일 낮에 설치 기사님이 오실 예정이야. 저녁에 네가 출근할 때쯤이면 준비가 끝나 있을 거야.\n\n새 제빙기는 얼음을 여러 번 넣을 수 있고, 새 오븐은 조금 더 다양한 방식으로 구울 수 있다더라. 그래도 기계가 새로워진다고 갑자기 모든 메뉴를 어렵게 만들 필요는 없겠지? 천천히 익혀 보면 돼.\n\n참, 오늘 관문 쪽은 좀 어땠니? 낮에는 시장 앞에서 감자 자루를 떨어뜨린 분이 계셔서 다 같이 줍느라 난리였어. 그래도 끝에는 다들 웃고 돌아가더라고.\n\n이제 푹 쉬렴. 내일 저녁에 보자~"}]);


inbox.push({id:'day10',sender:'사장님',title:'새 장비는 잘 작동하니?',when:'prep',body:'좋은 저녁!\n\n낮에 설치 기사님들이 다녀가셨고, 주방도 싹 정리해 뒀단다. 오븐에서는 이제 튀김도 만들 수 있대. 크리스피 치킨이랑 허니버터 감자튀김, 양념 치킨 레시피를 새로 등록해 뒀으니 확인해 보렴. 제빙기도 최대 세 번까지 얼음을 넣을 수 있을 만큼 쌩쌩 돌아가.\n\n아, 오늘 낮에 아주 웃긴 일이 있었어. 단골 손님이 우산을 두고 가셨길래 쫓아가서 건네드렸는데, 알고 보니 내 우산이더라! 정작 그분 우산은 카운터 밑에 있었고. 결국 서로 한참 웃었단다.\n\n새 장비에 적응하는 것도 좋지만, 너무 서두르진 말고. 오늘도 잘 부탁해!'});
inbox.push({id:'closing10',sender:'사장님',title:'오늘은 어떤 손님이 왔니?',when:'closing',body:'오늘도 수고 많았어!\n\n낮에는 손님 한 분이 이 근처에서 산책하기 좋은 골목을 물어보셨어. 막상 추천하려니까 매일 지나다니는 길인데도 뭐가 예쁜지 설명하기 어렵더라. 내일 낮에는 나도 가게 주변을 한번 걸어 보려고 해.\n\n네가 저녁에 만나는 사람들과 내가 낮에 만나는 사람들은 조금 다르겠지? 같은 가게에서 일하는데도 각자 보는 풍경이 다르다는 게 재미있어.\n\n오늘은 푹 쉬고, 내일도 좋은 저녁 맞이하렴!'});

inbox.push(...[{"id": "day22", "sender": "사장님", "title": "누가 두고 간 걸까?", "when": "prep", "body": "좋은 저녁!\n\n오늘 낮에 가게를 정리하다가 카운터 구석에서 작은 장갑 한 짝을 발견했단다.\n\n어제 손님이 두고 가신 걸까 싶어서 한참 들여다봤는데, 어디서 본 것 같기도 하고 도무지 기억이 안 나더라. 손님들 얼굴은 제법 잘 기억하는 편인데, 누가 어떤 장갑을 끼고 있었는지까지는 모르겠어. 하하.\n\n일단 잃어버린 물건을 보관하는 서랍에 넣어 뒀어. 혹시 저녁에 찾으러 오시는 분이 있으면 알려 주렴.\n그런데 장갑이 한 짝만 없어지면 나머지 한 짝은 어떻게 되는 걸까? 주인도 곤란하겠지만, 남겨진 장갑도 어쩐지 좀 불쌍하네.\n\n아무튼 오늘도 잘 부탁해!"}, {"id": "closing22", "sender": "사장님", "title": "오늘 저녁 메뉴는", "when": "closing", "body": "오늘도 고생 많았어!\n\n실은 오늘 저녁에 새로운 요리를 만들어 보려고 했단다. 가게 메뉴로 내놓을 건 아니고, 그냥 내가 먹으려고 말이야.\n냉장고에 남아 있던 재료를 이것저것 넣고 끓였는데, 처음에는 제법 그럴듯한 냄새가 나더라고. 그래서 조금 욕심을 내서 양념을 더 넣었지 뭐니.\n\n그랬더니…… 맛이 아주 묘해졌어.\n못 먹을 정도는 아닌데, 그렇다고 다시 먹고 싶지도 않은 맛이랄까? 결국 한 그릇 먹고 나머지는 냉장고에 넣어 뒀단다.\n내일 다시 데워 먹으면 좀 나아지려나. 하하.\n\n아무튼 오늘도 수고 많았어. 푹 쉬고 내일 보자!"}]);

inbox.push(...[{"id": "day23", "sender": "사장님", "title": "오늘 낮에 있었던 일", "when": "prep", "body": "오늘도 좋은 저녁이야!\n\n낮에는 손님이 제법 있었어. 점심 무렵에 단체로 들어온 사람들이 있었는데, 모두 음료를 따로 주문하는 바람에 한참 바빴지 뭐야. 그래도 다들 느긋하게 기다려 줘서 다행이었단다.\n\n아, 그리고 오늘은 가게 앞을 청소하다가 작은 동전을 하나 주웠어. 처음에는 크레딧인 줄 알았는데, 자세히 보니 오래전에 쓰던 기념주화더구나. 어디서 굴러왔는지 모르겠어. 일단 카운터 서랍에 넣어 뒀으니 궁금하면 한번 구경해 봐.\n\n그러고 보니 어제 남겨 둔 간식은 먹었니? 분명 냉장고에 넣어 뒀던 것 같은데, 오늘 찾아보니까 없어졌더라고. 내가 먹고 잊어버린 건지, 네가 먹은 건지 영 기억이 안 나네. 하하!\n\n아무튼 오늘도 잘 부탁한다. 밤에는 날이 좀 쌀쌀해진다고 하니 퇴근할 때 조심하고!"}, {"id": "closing23", "sender": "사장님", "title": "시큼한 과일과 새 행주", "when": "closing", "body": "오늘도 고생 많았어!\n\n아까 집에 돌아오는 길에 과일을 좀 사 왔단다. 처음 보는 품종이라 신기해서 몇 개 집어 왔는데, 막상 먹어 보니 생각보다 엄청 시더구나. 가게에서 신메뉴라도 만들어 볼까 싶었는데, 이걸 어떻게 써야 할지는 조금 더 고민해 봐야겠어.\n\n결국 반도 못 먹고 남겼는데, 괜히 욕심을 부렸나 봐. 내일은 꿀이라도 조금 곁들여 먹어야겠어.\n\n참, 낮에 쓰던 행주를 새것으로 바꿔 뒀어. 전부터 하나가 너무 낡아서 바꿔야지 생각만 하고 있었거든. 막상 새걸 꺼내 놓으니까 그렇게 개운할 수가 없더라. 진작 바꿀 걸 그랬어.\n\n가게는 내가 아침에 다시 확인할 테니까 너무 신경 쓰지 말고 푹 쉬렴. 내일도 좋은 하루 보내고!"}]);

inbox.push(...[{"id": "day24", "sender": "사장님", "title": "장바구니", "when": "prep", "body": "좋은 저녁이야!\n\n오늘 낮에는 장을 보러 나갔다가 아주 커다란 장바구니를 하나 사 왔단다. 원래 쓰던 게 손잡이부터 해져서, 이번에는 좀 튼튼한 걸로 골라 봤거든. 그런데 막상 물건을 담아 보니까 바구니만 커졌지, 내가 한 번에 들 수 있는 양은 그대로더구나. 무거워서 중간에 몇 번이나 내려놓고 왔어. 하하.\n\n그리고 낮 손님 중에 음료를 주문하러 오셨다가 가방에서 작은 수첩을 꺼내 한참 뒤적이는 분이 있었어. 마음에 드는 메뉴를 적어 둔 줄 알았더니, 오늘 사야 할 물건 목록이었대. 가게에 들어온 김에 뭐 하나 잊은 것 같다고 하시더라고. 결국 음료를 다 마실 때까지 생각이 안 나셨는데, 나가시다가 갑자기 기억났는지 다시 들어와서 음료를 또 주문하고 목록을 쓰기 시작한 거 있지.\n\n아무튼 장은 넉넉히 봐 뒀고, 재료도 확인해 놨어. 너무 무리하지 말고 저녁 영업 잘 부탁해. 오늘도 수고 많을 거야!"}, {"id": "closing24", "sender": "사장님", "title": "내일은 뭘 먹을까?", "when": "closing", "body": "오늘도 고생 많았어!\n\n저녁에 밥을 먹으려고 냉장고를 열었는데, 아침에 사 둔 채소가 생각보다 많이 남아 있더구나. 분명 딱 먹을 만큼만 샀다고 생각했는데, 장바구니가 커지니까 괜히 더 집어 왔나 봐. 그래서 이것저것 썰어 넣고 카레를 끓였어. 처음엔 너무 많이 만들었다 싶었는데, 한 그릇 먹고 나니 내일 아침 몫까지 생겨서 오히려 잘됐지 뭐야.\n\n그런데 요리를 다 끝내고 나서야 빵을 사 오기로 했다는 게 생각났어. 그걸 잊을까 봐 가게를 나서기 전에 분명 메모까지 해 뒀는데 말이야. 메모는 아주 얌전히 주머니에 들어 있더라. 하하. 내일은 장 볼 때 먼저 꺼내 봐야겠어.\n\n참, 오늘 밤에 더 챙길 건 없으니까 마무리 잘하고 들어가렴. 늦은 시간이니 돌아가는 길도 조심하고. 푹 쉬어!"}]);

inbox.push(...[{"id": "day25", "sender": "사장님", "title": "자꾸 사라지는 집게", "body": "좋은 저녁!\n\n오늘은 낮부터 집게를 찾느라 한바탕 소란을 피웠단다. 주방에 분명 세 개나 있었는데, 바쁠 때마다 하나씩 없어지는 거야. 싱크대도 뒤져 보고, 선반 위도 살펴보고, 심지어 냉장고 안까지 열어 봤지 뭐니. 손님들이 기다리는데 나는 집게만 찾아다니고 있으니 참 우스운 광경이었겠다 싶어. 하하.\n\n그런데 알고 보니 하나는 내가 앞치마 주머니에 넣고 있었고, 다른 하나는 씻어 놓고 물기를 말리던 중이더구나. 마지막 하나는... 아직도 모르겠어. 혹시 네가 저녁에 발견하면 제자리에 걸어 주렴. 다음에는 집게 놓는 자리에 아예 이름표라도 붙여야겠어.\n\n아, 그리고 오늘 낮에 꼬치를 주문하신 손님이 곁들여 드실 소스를 따로 가져오셨더라고. 자기만의 조합이 있다면서 아주 진지하게 드시는데, 덕분에 나까지 궁금해졌지. 나중에 무슨 맛인지 물어볼까 하다가 괜히 식사를 방해할까 싶어서 참았단다.\n\n재료는 미리 점검해 뒀어. 오늘은 주말 전 마지막 영업일이니 마감할 때 냉장고 문만 잘 확인해 주렴. 그럼 오늘도 부탁할게!", "when": "prep"}, {"id": "closing25", "sender": "사장님", "title": "집게는 찾았어", "body": "오늘도 고생 많았어!\n\n아침부터 찾던 집게 말인데, 결국 찾았단다. 글쎄, 그 집게를 집까지 가져가버린 거 있지. 얼마나 한심하던지 혼자 웃었어. 괜히 집게를 의심한 것 같네. 하하.\n\n저녁에는 집에서 간단하게 국수를 해 먹었어. 새 재료를 넣어 볼까 했다가 그냥 늘 먹던 걸로 만들었지. 하루 종일 왔다 갔다 했더니 복잡한 요리를 할 기운이 안 나더라. 그래도 따뜻한 걸 먹고 나니 좀 살겠어.\n\n참, 이번 주도 참 바빴지? 이제 주말이니 쉬는 동안은 가게 생각을 조금 덜 해도 돼. 내가 낮에 정리할 건 정리해 둘 테니까 말이야. 집에 가면 푹 자고, 끼니도 거르지 말고.\n\n이번 주도 정말 수고 많았어. 편히 쉬렴!", "when": "closing"}, {"id": "mzweek25mail", "sender": "사장님", "title": "쉬는 날엔", "body": "주말 잘 보내고 있니?\n\n나는 아침에 조금 늦게 일어났어. 평소엔 알람이 울리기도 전에 눈이 떠지는데, 오늘은 햇빛이 한참 들어오고 나서야 일어났단다. 덕분에 아침을 먹을까 점심을 먹을까 고민하다가 둘 다 아닌 애매한 시간에 식사를 했어. 뭐, 쉬는 날에는 그런 것도 좋지.\n\n오후에는 오래된 찬장을 정리하려고 했는데, 안쪽에서 예전에 쓰던 찻잔이 나와서 한참 들여다봤단다. 짝이 없어진 줄 알았던 받침까지 같이 있더라고. 신기해서 꺼내 놓긴 했는데, 막상 쓰기엔 아까워서 다시 넣어 둘까 고민 중이야. 하하.\n\n너도 너무 바쁘게 보내려고 하지 말고, 하고 싶은 게 있으면 하고 아무것도 하기 싫으면 그냥 푹 쉬어. 가게는 내가 잘 보고 있을 테니까.", "when": "weekend"}]);

inbox.push(...[{"id": "day26", "sender": "사장님", "title": "홍보 효과가 글쎄", "body": "좋은 저녁! 주말은 잘 쉬었니?\n\n나는 어제 싱크대 아래를 정리하다가 잊고 있던 작은 양념통을 세 개나 발견했어. 하나는 뚜껑만 있고, 하나는 안에 아무것도 없고, 마지막 하나는 뭘 담았는지 이름표가 다 지워졌더구나. 혹시나 해서 냄새를 맡아 봤는데 도저히 모르겠어서 결국 셋 다 치워 버렸지. 하하, 빈 통만 이렇게 열심히 모아 놓을 일인가 싶어.\n\n낮에는 가게가 좀 북적였어. 지난주에 올라온 먹방 영상 이야기를 하는 손님들이 몇 분 있었거든. 간판을 보고 들어왔다가 여기가 영상 속 그 지점이냐고 묻는 분도 계셨고. 덕분에 식기 정리할 틈이 없어서 설거지는 조금 늦게 끝냈지 뭐야.\n\n아무튼 밤에 단체 손님이 와도 당황하지 말고 하나씩 준비해 주렴. 늘 하던 대로 하면 돼. 오늘도 잘 부탁해!", "when": "prep"}, {"id": "closing26", "sender": "사장님", "title": "설거지는 누가 했을까", "body": "오늘도 고생 많았어!\n\n오늘 낮에는 단체로 손님이 오셔서 정신이 하나도 없었는데, 저녁에도 사람들이 많이 왔니? 난 그렇게 식탁 하나가 꽉 차는 모습을 보면 괜히 뿌듯하더라. 물론 나중에 쌓이는 접시를 보면 잠깐 후회하기도 하지만 말이야. 하하.\n\n그런데 있지, 낮에 접시를 전부 씻어 놓고 나서 보니까 컵 하나가 없어졌더라고. 아무리 찾아도 안 보여서 손님이 실수로 가져가셨나 했는데, 글쎄, 내가 꽃병에 꽂아 놓은 거 있지. 설거지를 마치고 손에 들고 있다가 무슨 생각으로 거기 뒀는지 모르겠어. 꽃도 없는 꽃병에 컵만 덩그러니 들어 있었단다.\n\n참, 관문시장에 이상한 재료가 새로 나왔더라?\n오늘은 푹 쉬어. 내일도 잘 부탁할게!", "when": "closing"}]);

const marketRecipeRewards=[
 {required:['mint'],name:'베르단트 헤이즈',kind:'drink',seq:'BBCVVV',mode:'layer',extra:'mint'},
 {required:['smoke'],name:'훈연 허브 버섯구이',kind:'food',foodBase:'버섯',foodSauce:'허브',foodKind:'구이',addons:['smoke']},
 {required:['fire'],name:'파이어 앤드 저스티스',kind:'drink',seq:'CCCCC',mode:'mix',extra:'fire'},
 {required:['chocoball'],name:'카라멜 쇼콜라',kind:'drink',seq:'AAAAARR',mode:'mix',extra:'chocoball'},

 {required:['rice'],name:'제육볶음밥',kind:'food',foodBase:'육류',foodSauce:'매운 양념',foodKind:'볶음',addons:['rice']},
 {required:['curry'],name:'스파이시 카레 우동',kind:'food',foodBase:'곡물 반죽',foodSauce:'매운 양념',foodKind:'국물',addons:['curry']}
];
function migrateMarketRecipeNames(){
 if(!Array.isArray(s.customRecipes))s.customRecipes=[];
 const renamed={'민트 블루 아워':'베르단트 헤이즈','스모키 버섯볶음':'훈연 허브 버섯구이','초코칩 라스트 마일':'카라멜 쇼콜라','초코볼 라스트 마일':'카라멜 쇼콜라','민트 초코 믹스':'프로스트 카카오'};
 for(const r of s.customRecipes){
  if(!r||!renamed[r.name]||(r.source!=='market'&&!String(r.signature||'').startsWith('market:')))continue;
  const target=marketRecipeRewards.find(x=>x.name===renamed[r.name]);if(!target)continue;
  Object.assign(r,target,{source:'market',registered:true,signature:'market:'+target.name});
 }
 for(const field of ['recipeNotices','recipeNoticeSeen'])if(Array.isArray(s[field]))s[field]=[...new Set(s[field].map(n=>renamed[n]||n))];
}
function mzEnsureCustomIds(){
 if(!Array.isArray(s.customRecipes))s.customRecipes=[];
 const seen=new Set();
 for(const r of s.customRecipes){
  if(!r||r.source==='market')continue;
  if(typeof r.uid!=='string'||!r.uid.startsWith('user:')||seen.has(r.uid)){
   let i=1;while(seen.has('user:'+i)||s.customRecipes.some(x=>x!==r&&x.uid==='user:'+i))i++;
   r.uid='user:'+i;
  }
  seen.add(r.uid);
 }
}
function mzCustomRecipeConflict(r){
 const matches=[...drinks,...availableFoods(),...(s.customRecipes||[]).filter(x=>x.source==='market')];
 return matches.some(x=>x.name===r.name);
}
function mzRecipeEditDay(){return s.phase==='closing'&&s.day>=3;}
function mzRecipeSignature(r){
 if(r.kind==='food')return 'F:'+r.foodBase+':'+r.foodSauce+':'+r.foodKind+':'+(r.addons||[]).slice().sort().join(',');
 const mode=r.mode||'layer',seq=r.seq||'';
 return 'D:'+mode+':'+(mode==='mix'?seq.split('').sort().join(''):mode==='partial'?seq.slice(0,r.mixAt||0).split('').sort().join('')+'|'+seq.slice(r.mixAt||0):seq)+':'+(mode==='partial'?(r.mixAt||0)+':':'')+(r.extra||'none');
}
function syncMarketRecipeRewards(){
 if(!Array.isArray(s.customRecipes))s.customRecipes=[];
 migrateMarketRecipeNames();mzEnsureCustomIds();if(!Array.isArray(s.developmentDays))s.developmentDays=s.developmentDone?[3]:[];s.developmentDays=[...new Set(s.developmentDays.filter(d=>Number.isInteger(d)&&d>=3&&d<=(s.devPreview?50:LAST_SCRIPTED_DAY)&&d%3===0))];if(s.developmentDone&&!s.developmentDays.includes(3))s.developmentDays.unshift(3);
 if(!Array.isArray(s.recipeNotices))s.recipeNotices=[];
 for(const reward of marketRecipeRewards){
  if(!reward.required.every(id=>(s.ownedMarket||[]).includes(id)))continue;
  if(s.customRecipes.some(r=>r.source==='market'&&r.name===reward.name))continue;
  s.customRecipes.push({...reward,source:'market',registered:true,signature:'market:'+reward.name});
  if(!s.recipeNotices.includes(reward.name))s.recipeNotices.push(reward.name);

const MZ_EXPRESSION_TAGS={일반:'normal',웃음:'smile',의문:'question',normal:'normal',smile:'smile',question:'question'};
function mzParseExpressionLine(raw){
 if(typeof raw!=='string')return {text:raw==null?'':String(raw),expression:null};
 const match=raw.match(/^(.*?)(?:\s*\[([^\[\]]+)\])\s*$/);
 if(!match)return {text:raw,expression:null};
 const key=(match[2]||'').trim();
 const expression=MZ_EXPRESSION_TAGS[key]||null;
 return expression?{text:match[1].replace(/\s+$/,''),expression}:{text:raw,expression:null};
}
function mzTaggedLineDisplay(raw){return mzParseExpressionLine(raw).text;}
function mzVisitPortraitExpression(v,sub,lineIndex){
 if(!v||v.who!=='마렌')return 'normal';
 let current='normal';
 const apply=(raw)=>{const parsed=mzParseExpressionLine(raw);if(parsed.expression)current=parsed.expression;};
 if(sub==='dialogue'||sub==='after'){
  const dialogLines=Array.isArray(v.dialogue)?v.dialogue:[];
  const afterLines=currentAfterLines(v);
  if(sub==='dialogue'){
   for(let i=0;i<=Math.min(lineIndex,dialogLines.length-1);i++)apply(dialogLines[i]?.[1]);
  }else{
   for(const line of dialogLines)apply(line?.[1]);
   for(let i=0;i<=Math.min(lineIndex,afterLines.length-1);i++)apply(afterLines[i]?.[1]);
  }
  return current;
 }
 if(sub==='appointment'||sub==='appointmentReply'){
  const offer=v.appointmentOffer||{};
  if(typeof offer.prompt==='string')apply(offer.prompt);
  if(sub==='appointmentReply')apply(lineIndex===1?offer.acceptReply:offer.declineReply);
 }
 return current;
}
function mzActivePortraitExpression(v){
 if(!v)return 'normal';
 if(v.who!=='마렌')return 'normal';
 if(s.sub==='dialogue'||s.sub==='after')return mzVisitPortraitExpression(v,s.sub,s.line);
 if(s.sub==='order')return mzVisitPortraitExpression(v,'dialogue',Math.max(0,(Array.isArray(v.dialogue)?v.dialogue.length:1)-1));
 if(s.sub==='appointment'||s.sub==='appointmentReply')return mzVisitPortraitExpression(v,s.sub,s.line);
 return 'normal';
}

}

function mzScheduleAppointments(){return Array.isArray(s.appointments)?s.appointments.filter(a=>a&&mzAppointmentCatalog[a.id]&&a.status==='accepted'):[]}
function mzOfferAppointment(offer){
 if(!offer||!mzAppointmentCatalog[offer.id]||s.appointmentDecisions?.includes(offer.id))return false;
 return !mzScheduleAppointments().some(a=>a.weekendAfterDay===mzAppointmentCatalog[offer.id].weekendAfterDay);
}
function mzAnswerAppointment(accepted){
 const offer=current()?.appointmentOffer;if(!offer||s.sub!=='appointment')return;
 if(!Array.isArray(s.appointmentDecisions))s.appointmentDecisions=[];if(!Array.isArray(s.deskOwned))s.deskOwned=[];if(!Array.isArray(s.deskPlaced))s.deskPlaced=[];

 if(accepted&&mzAppointmentCatalog[offer.id]&&!mzScheduleAppointments().some(a=>a.weekendAfterDay===mzAppointmentCatalog[offer.id].weekendAfterDay)){
  s.appointments.push({id:offer.id,weekendAfterDay:mzAppointmentCatalog[offer.id].weekendAfterDay,status:'accepted',acceptedDay:s.day});
 }
 s.sub='appointmentReply';s.line=accepted?1:0;render();
}
function mzScheduleMarkup(){
 const currentDay=s.day,week=Math.floor((currentDay-1)/5)+1,weekStart=(week-1)*5+1;
 const work=Array.from({length:5},(_,i)=>weekStart+i);
 const upcoming=mzScheduleAppointments().filter(a=>a.weekendAfterDay>=currentDay).sort((a,b)=>a.weekendAfterDay-b.weekendAfterDay);
 const calendar=work.map(d=>`<div class="mz161-calday ${d===currentDay?'is-today':''}"><small>DAY ${String(d).padStart(2,'0')}</small><strong>${d===currentDay?'오늘':'영업'}</strong></div>`).join('');
 const end=weekStart+4;
 const events=[`<div class="mz161-schedule-item"><strong>18:00–02:00 · MILE ZERO 관문 지점</strong><small>오늘의 정규 근무</small></div>`,
  `<div class="mz161-schedule-item"><strong>DAY ${String(end).padStart(2,'0')} · 주간 마감</strong><small>영업 종료 후 주말 휴무</small></div>`];
 if(currentDay>=3){const next=Array.from({length:52},(_,i)=>currentDay+i).find(d=>d>=3&&d%3===0&&!(s.developmentDays||[]).includes(d));if(next)events.push(`<div class="mz161-schedule-item"><strong>DAY ${String(next).padStart(2,'0')} · 지점 한정 메뉴 개발</strong><small>${next===currentDay?'오늘 개발 가능':'다음 개발 가능 영업일'}</small></div>`)}
 if(s.regularUnlocks?.includes('mechanic'))events.push('<div class="mz161-schedule-item"><strong>야간 정비사의 특별 메뉴</strong><small>의뢰 완료 · 레시피 해금</small></div>');
 for(const a of upcoming){const event=mzAppointmentCatalog[a.id];events.push(`<div class="mz161-schedule-item mz161-personal"><strong>DAY ${a.weekendAfterDay} 영업 후 주말 · ${esc(event.title)}</strong><small>${esc(event.with)}와의 약속 · 수락함</small></div>`)}
 return `<div class="mz161-schedule"><h3>WEEK ${String(week).padStart(2,'0')} · 근무 달력</h3><div class="mz161-workweek">${calendar}<div class="mz161-calday mz161-off"><small>주말</small><strong>휴무</strong></div></div><h3>예정된 일정</h3>${events.join('')}</div>`;
}

function mzWeekCheckpoint(day){
 if(!MZ_WEEK_STARTS.includes(day)||day>LAST_SCRIPTED_DAY)return;
 if(s.day!==day||s.phase!=='prep'||s.visit!==0)return;
 try{
  const key=MZ_WEEK_CHECKPOINT_PREFIX+day;
  // The first arrival snapshot is the canonical beginning of the week.
  if(localStorage.getItem(key))return;
  s.snsHearts=[...mzHearts];
  const copy=JSON.parse(JSON.stringify(s));
  localStorage.setItem(key,JSON.stringify({version:1,day,recordedAt:new Date().toLocaleString('ko-KR'),state:copy}));
 }catch(err){console.warn('Weekly checkpoint could not be saved:',err)}
}
function mzGetWeekCheckpoint(day){
 if(!MZ_WEEK_STARTS.includes(day)||day>LAST_SCRIPTED_DAY)return null;
 try{
  const raw=JSON.parse(localStorage.getItem(MZ_WEEK_CHECKPOINT_PREFIX+day)||'null');
  if(raw?.version!==1||raw.day!==day||!raw.state||raw.state.day!==day||raw.state.phase!=='prep'||raw.state.visit!==0)return null;
  return raw;
 }catch(err){return null}
}

function snsDisplayText(value){const item=dayTwelveTrend();return String(value).replaceAll('{유행_토핑}',item?item.name:'그 토핑');}
// Weekend posts are published AFTER their matching workday, regardless of clock time.
// Keep the original day values for save compatibility and story conditions.
function mzSnsPublicationOrder(p){return (Number(p.day)||1)*2+(p.weekendOnly?1:0)}
function visiblePosts(){return feedPosts.filter(p=>(!p.day||p.day<=s.day)&&(!p.weekendOnly||s.day>p.day||(s.day===p.day&&(bootScreen==='weekend'||(s.weekendsCompleted||[]).includes(p.day))))).slice().sort((a,b)=>mzSnsPublicationOrder(b)-mzSnsPublicationOrder(a)||String(b.time||'').localeCompare(String(a.time||'')))}
function unreadPosts(){return visiblePosts().filter(p=>!(s.readPosts||[]).includes(p.id)).length}
// SNS hearts belong to the active game state and are included in save slots.
// Previous global browser likes are deliberately not restored.
let mzHearts=new Set();
function mzRestoreHearts(){
 if(!Array.isArray(s.snsHearts))s.snsHearts=[];
 mzHearts=new Set(s.snsHearts.filter(id=>typeof id==='string'));
}
function mzHeartMarkup(id){const liked=mzHearts.has(id);return `<button type="button" class="mz-heart-btn${liked?' is-liked':''}" data-like-post="${esc(id)}" aria-label="${liked?'좋아요 취소':'좋아요'}" aria-pressed="${liked?'true':'false'}" title="${liked?'좋아요 취소':'좋아요'}"><lucian-heart state="${liked?'on':'off'}" size="24" weight="1.75" tone="color" animate="none" aria-hidden="true"></lucian-heart></button>`}
function mzToggleHeart(id){
 if(mzHearts.has(id))mzHearts.delete(id);else {mzHearts.add(id);window.mileEffects?.play?.('sns');}
 s.snsHearts=[...mzHearts];
 document.querySelectorAll('[data-like-post]').forEach(b=>{
   if(b.dataset.likePost!==id)return;
   const liked=mzHearts.has(id);b.classList.toggle('is-liked',liked);b.setAttribute('aria-pressed',String(liked));b.setAttribute('aria-label',liked?'좋아요 취소':'좋아요');b.title=liked?'좋아요 취소':'좋아요';
   const icon=b.querySelector('lucian-heart');if(icon){if(typeof icon.setState==='function')icon.setState(liked?'on':'off');else icon.setAttribute('state',liked?'on':'off')}
 });
}
document.addEventListener('click',e=>{const btn=e.target.closest?.('[data-like-post]');if(btn){e.preventDefault();mzToggleHeart(btn.dataset.likePost)} });
function phoneView(){const mzWeekendPhone=bootScreen==='weekend'&&mzWeekendPhoneOpen;if(!mzWeekendPhone&&(bootScreen!=='phone'||s.phase!=='prep')){const old=$('prePhone');if(old)old.remove();return;}let el=$('prePhone');if(!el){el=document.createElement('div');el.id='prePhone';el.className='prephone-wrap';document.body.appendChild(el)}el.classList.toggle('mz116-weekend-phone',mzWeekendPhone);let tab=s.phoneTab||'feed';const oldBody=el.querySelector('.phone-body');if(oldBody)mzPhoneScroll[el.dataset.activeTab||tab]=oldBody.scrollTop;const nav=['feed','mail','schedule'].map((id,i)=>`<button class="phone-tab ${tab===id?'active':''}" data-ptab="${id}">${['FEED','MAIL','SCHEDULE'][i]}${id==='feed'&&unreadPosts()?` <span class="phone-count">${unreadPosts()}</span>`:''}${id==='mail'&&inbox.filter(m=>s.deliveredMessages.includes(m.id)&&!s.readMessages.includes(m.id)).length?` <span class="phone-count">${inbox.filter(m=>s.deliveredMessages.includes(m.id)&&!s.readMessages.includes(m.id)).length}</span>`:''}</button>`).join('');let body='';
if(tab==='feed'){body=visiblePosts().map(p=>`<article class="post"><div class="post-head"><strong>${esc(p.author)}</strong><small>${dayLabel(p.day||1)}${p.weekendOnly?' · 주말':''} · ${p.time} ${!(s.readPosts||[]).includes(p.id)?'<span class="phone-new">NEW</span>':''}</small></div><p>${esc(snsDisplayText(p.text))}</p><div class="post-actions">${mzHeartMarkup(p.id)}<button class="phone-link" data-post="${p.id}">댓글 ${p.comments.length} ${expandedPosts.has(p.id)?'▴':'▾'}</button></div>${expandedPosts.has(p.id)?p.comments.map(c=>`<div class="comment"><strong>${esc(c[0])}</strong> ${esc(c[1])}</div>`).join(''):''}</article>`).join('')}
else if(tab==='mail'){const messages=receivedMail();const m=messages.find(m=>m.id===phoneMail);body=m?`<button class="phone-link phone-back" id="backPhoneMail">‹ 받은편지함</button><div class="post"><div class="mail-head"><strong>${esc(m.title)}</strong></div><div class="phone-muted">${esc(m.sender)}</div><hr><p class="phone-copy">${esc(m.body)}</p></div>`:messages.map(m=>`<button class="phone-row" data-pmail="${m.id}"><strong>${esc(m.title)} ${!s.readMessages.includes(m.id)?'<span class="phone-new">NEW</span>':''}</strong><small>${esc(m.sender)}</small></button>`).join('')}
else {body=mzScheduleMarkup()}
el.innerHTML=`<div class="phone" role="dialog" aria-label="출근 전 휴대 단말기"><div class="phone-head"><strong>CITY NETWORK</strong><span>${dayLabel(s.day)} · 17:42</span><button class="phone-theme" type="button" id="phoneTheme">${s.light==='dark'?'☀ LIGHT':'☾ DARK'}</button></div><nav class="phone-tabs">${nav}</nav><div class="phone-body">${body}</div><footer class="phone-footer"><button id="phoneStart">${mzWeekendPhone?'‹ 주말 화면으로 돌아가기':'출근하기 ›'}</button></footer></div>`;
el.dataset.activeTab=tab;const phoneBody=el.querySelector('.phone-body');if(phoneBody)phoneBody.scrollTop=mzPhoneScroll[tab]||0;el.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{if(phoneBody)mzPhoneScroll[tab]=phoneBody.scrollTop;s.phoneTab=b.dataset.ptab;phoneMail=null;phoneView()});el.querySelectorAll('[data-post]').forEach(b=>b.onclick=()=>{const id=b.dataset.post;if(phoneBody)mzPhoneScroll.feed=phoneBody.scrollTop;expandedPosts.has(id)?expandedPosts.delete(id):expandedPosts.add(id);if(!s.readPosts.includes(id))s.readPosts.push(id);phoneView()});el.querySelectorAll('[data-pmail]').forEach(b=>b.onclick=()=>{phoneMail=b.dataset.pmail;if(!s.readMessages.includes(phoneMail))s.readMessages.push(phoneMail);phoneView()});const back=$('backPhoneMail');if(back)back.onclick=()=>{phoneMail=null;phoneView()};$('phoneStart').onclick=()=>{if(mzWeekendPhone){mzWeekendPhoneOpen=false;phoneMail=null;phoneView();return;}start();phoneView()};u219RefreshThemeButton($('phoneTheme'));$('phoneTheme').onclick=()=>switchLight('settings');}

let mzDeskSelection=null;
function mzDeskState(){
 if(!Array.isArray(s.deskOwned))s.deskOwned=[];
 if(!Array.isArray(s.deskPlaced))s.deskPlaced=[];
 // Silent, idempotent retroactive awards. No toast, NEW badge or journal edits.
 const award=(id,done)=>{if(done&&!s.deskOwned.includes(id))s.deskOwned.push(id)};
 award('mile_logo_sticker',s.day>5||(s.day===5&&s.phase==='closing'));
 award('mile_branch_certificate',s.day>15||(s.day===15&&s.phase==='closing'));
 award('maren_market_photo',Array.isArray(s.weekendStoriesDone)&&s.weekendStoriesDone.includes('maren_market'));
 award('torban_wasteland_bouquet',(s.guestVisits||[]).some(x=>x.who==='토르반'&&x.day===29));

 return s.deskPlaced;
}
function mzDeskItem(id){return MZ_DESK_CATALOG.find(item=>item.id===id)}
function mzDeskMarketStock(day=s.day){return MZ_DESK_CATALOG.filter(item=>item.source!=='gift'&&day>=item.unlockDay)}
function mzDeskMarketWeek(day=s.day){return Math.max(1,Math.floor((day-1)/5)+1)}
function mzDeskBuy(id){
 const item=mzDeskItem(id);mzDeskState();if(s.phase!=='closing'||s.day<7||!item||item.source==='gift'||s.day<item.unlockDay||s.deskOwned.includes(id)||s.wallet<item.price)return false;
 s.wallet-=item.price;s.deskOwned.push(id);return true;
}
function mzDeskPlace(id,x,y){
 const item=mzDeskItem(id);mzDeskState();if(!item||!s.deskOwned.includes(id))return false;
 x=Math.max(.055,Math.min(.945,Number(x)||0.5));y=Math.max(.08,Math.min(.92,Number(y)||0.5));
 // wall is upper area, shelf in the middle, desk surface at the bottom.
 if(item.zone==='wall'&&y>.49)return false;
 if(item.zone==='surface'&&y<.46)return false;
 const old=s.deskPlaced.find(p=>p.id===id);
 if(old){old.x=x;old.y=y;old.z=Date.now();}else s.deskPlaced.push({id,x,y,z:Date.now()});
 return true;
}
function mzDeskClearPlace(id){mzDeskState();s.deskPlaced=s.deskPlaced.filter(p=>p.id!==id)}
function mzDeskBoard(){
 mzDeskState();const itemMap=new Map(MZ_DESK_CATALOG.map(i=>[i.id,i]));
 const placed=s.deskPlaced.filter(p=>itemMap.has(p.id)&&s.deskOwned.includes(p.id)).sort((a,b)=>(a.z||0)-(b.z||0));
 return `<div class="mz167-board mz186-board" id="mz167Board" aria-label="자유배치 책상"><div class="mz167-wallhint">WALL</div><div class="mz167-shelf"></div><div class="mz167-desk"></div><div class="mz167-deskhint">DESK</div>${placed.map(p=>{const item=itemMap.get(p.id);return `<button type="button" class="mz167-placed" data-desk-id="${item.id}" style="left:${(p.x*100).toFixed(2)}%;top:${(p.y*100).toFixed(2)}%" title="${item.name} · 드래그하여 이동"><span>${item.icon}</span><small>${item.name}</small></button>`}).join('')}</div>`;

 return `<div class="mz186-inventory"><section class="mz167-controls"><div class="mz167-summary"><b>MY DESK</b><span>보유 소품 ${s.deskOwned.length}/${MZ_DESK_CATALOG.length}</span></div><p class="mz167-note"><span style="display:block">소품 선택 후 클릭하여 배치 · 드래그하여 이동</span><span style="display:block">벽 장식은 벽에, 탁상 소품은 선반·책상에 배치 가능</span></p><div class="mz167-stock">${MZ_DESK_CATALOG.filter(item=>s.deskOwned.includes(item.id)).map(item=>{const owned=s.deskOwned.includes(item.id),selected=mzDeskSelection===item.id,placedAlready=!!s.deskPlaced.find(p=>p.id===item.id);return `<div class="mz167-stockitem"><span class="mz167-icon">${item.icon}</span><span class="mz167-itemname">${item.name}<small>${item.zone==='wall'?'벽':'책상·선반'}</small><small class="mz169-description">${esc(item.description||'')}</small></span>${owned?`<button type="button" class="boot-btn ${selected?'highlight':''}" data-desk-select="${item.id}">${selected?'선택됨':placedAlready?'이동':'배치'}</button>${placedAlready?`<button type="button" class="boot-btn" data-desk-remove="${item.id}">회수</button>`:''}`:''}</div>`}).join('')}</div>${s.deskOwned.length?'':'<p class="mz167-note">보유한 소품이 없습니다. 마감 후 관문시장에서 구입해 보세요.</p>'}</section></div>`;

function mzBindDesk(root){
 const board=root.querySelector('#mz167Board');if(!board)return;
 const redraw=()=>bootView();
 root.querySelectorAll('[data-desk-select]').forEach(b=>b.onclick=()=>{mzDeskSelection=b.dataset.deskSelect;redraw()});
 root.querySelectorAll('[data-desk-remove]').forEach(b=>b.onclick=()=>{mzDeskClearPlace(b.dataset.deskRemove);redraw()});
 function coords(e){const r=board.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
 let dragging=null,moved=false;
 board.querySelectorAll('[data-desk-id]').forEach(b=>{
  b.addEventListener('pointerdown',e=>{dragging={id:b.dataset.deskId,pointer:e.pointerId};moved=false;b.setPointerCapture(e.pointerId);e.preventDefault()});
  b.addEventListener('pointermove',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;const [x,y]=coords(e);b.style.left=`${Math.max(5,Math.min(95,x*100))}%`;b.style.top=`${Math.max(8,Math.min(92,y*100))}%`;moved=true;});
  b.addEventListener('pointerup',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;const [x,y]=coords(e);if(moved)mzDeskPlace(dragging.id,x,y);else mzDeskSelection=dragging.id;dragging=null;redraw()});
  b.addEventListener('pointercancel',()=>{dragging=null;redraw()});
 });
 board.addEventListener('click',e=>{if(e.target.closest('[data-desk-id]')||!mzDeskSelection)return;const [x,y]=coords(e);if(mzDeskPlace(mzDeskSelection,x,y))redraw();});
}

function u219CommitTheme(origin){
  const before=s.light;
  s.light=before==='dark'?'light':'dark';
  try{localStorage.setItem(THEME_KEY,s.light)}catch(e){}
  const inService=origin==='bar'&&bootScreen==='none'&&s.phase==='open'&&s.sub!=='interlude';
  const guest=inService?current():null;
  if(guest&&!s.lightSeen[guest.who]&&!s.lightComment){
    s.lightSeen[guest.who]=true;
    s.lightComment=s.light==='light'?'오늘은 불을 환하게 켰군요. 분위기가 달라졌네요.':'조명을 조금 낮췄네요. 은은해서 좋군요.';

  }
  // 테마 변경에서는 마감/신메뉴/저장 버튼 DOM을 재구성하지 않는다.
  // 교체되는 버튼에 클릭 이벤트가 이어져 다른 메뉴가 열리는 현상을 방지한다.
  document.body.classList.toggle('light',s.light==='light');
  u219SyncThemeButtons();
  if(inService && s.lightComment) dialog();

const mzRecipeWindowPositionKey='mz_recipe_window_position_v176';
function mzRecipeEnableDrag(){
 const panel=document.querySelector('#modalRoot .recipe-float');
 if(!panel)return;
 const header=panel.querySelector('.recipe-header');
 const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
 const place=(left,top)=>{
   const rect=panel.getBoundingClientRect();
   panel.style.left=clamp(left,8,Math.max(8,innerWidth-rect.width-8))+'px';
   panel.style.top=clamp(top,8,Math.max(8,innerHeight-rect.height-8))+'px';
   panel.style.right='auto';
 };
 try{
   const saved=JSON.parse(localStorage.getItem(mzRecipeWindowPositionKey)||'null');
   if(saved&&Number.isFinite(saved.left)&&Number.isFinite(saved.top))place(saved.left,saved.top);
 }catch(e){}
 let dragging=null;
 header.addEventListener('pointerdown',e=>{
   if(e.button!==0||e.target.closest('button,input,a'))return;
   const rect=panel.getBoundingClientRect();
   dragging={id:e.pointerId,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top};
   header.setPointerCapture(e.pointerId);
   e.preventDefault();
 });
 header.addEventListener('pointermove',e=>{
   if(!dragging||dragging.id!==e.pointerId)return;
   place(e.clientX-dragging.offsetX,e.clientY-dragging.offsetY);
 });
 function endDrag(e){
   if(!dragging||dragging.id!==e.pointerId)return;
   dragging=null;
   const rect=panel.getBoundingClientRect();
   try{localStorage.setItem(mzRecipeWindowPositionKey,JSON.stringify({left:rect.left,top:rect.top}));}catch(err){}
 }
 header.addEventListener('pointerup',endDrag);
 header.addEventListener('pointercancel',endDrag);
 // Keep a previously saved position on screen after viewport resizing.
 if(!window.mzRecipeDragResizeBound){
   window.mzRecipeDragResizeBound=true;
   window.addEventListener('resize',()=>{
     const pane=document.querySelector('#modalRoot .recipe-float');
     if(!pane||!pane.style.left)return;
     const r=pane.getBoundingClientRect();
     pane.style.left=clamp(r.left,8,Math.max(8,innerWidth-r.width-8))+'px';
     pane.style.top=clamp(r.top,8,Math.max(8,innerHeight-r.height-8))+'px';
   });
 }
}

const MZ_BACKUP_PREFIXES=['milezero_','MILE_ZERO_','MZ_','mz_'];
function mzPortableKey(key){return MZ_BACKUP_PREFIXES.some(prefix=>key.startsWith(prefix));}
function mzBackupKeys(){const keys=[];for(let n=1;n<=3;n++)keys.push(KEY+n);for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&mzPortableKey(k)&&!keys.includes(k))keys.push(k);}return keys;}
function mzTransferStatus(message,error=false){
 const e=document.getElementById('mzTransferStatus');if(e){e.textContent=message;e.style.color=error?'#f09b91':'';e.setAttribute('role',error?'alert':'status');}else if(error){alert(message)}
}
function mzExportBackup(){
 try{
  const entries={};for(const k of mzBackupKeys()){const v=localStorage.getItem(k);if(v!==null)entries[k]=v;}
  const slots=[1,2,3].filter(n=>Object.prototype.hasOwnProperty.call(entries,KEY+n));
  if(!slots.length){mzTransferStatus('저장된 슬롯이 없습니다. 먼저 슬롯에 저장해 주세요.',true);return;}
  const backup={format:'MILE_ZERO_SAVE_BACKUP',version:1,exportedAt:new Date().toISOString(),entries};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;
  link.download='MILE_ZERO_Save_Backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  mzTransferStatus('백업 파일을 저장했습니다. 새 사이트에서 이 파일을 가져오세요.');
 }catch(e){mzTransferStatus('백업 파일을 만들지 못했습니다. 브라우저의 다운로드·저장 권한을 확인해 주세요.',true);}
}
function mzBackupValidate(json){
 if(!json||json.format!=='MILE_ZERO_SAVE_BACKUP'||json.version!==1||!json.entries||typeof json.entries!=='object'||Array.isArray(json.entries))throw Error('MILE ZERO 백업 파일이 아니거나 지원하지 않는 형식입니다.');
 const entries=json.entries,keys=Object.keys(entries);
 if(!keys.length||keys.length>500||keys.some(k=>!mzPortableKey(k)||typeof entries[k]!=='string'))throw Error('백업 파일의 저장 항목이 올바르지 않습니다.');
 const slots=[1,2,3].filter(n=>Object.prototype.hasOwnProperty.call(entries,KEY+n));
 if(!slots.length)throw Error('백업 파일에 저장 슬롯이 없습니다.');
 for(const n of slots){let state;try{state=JSON.parse(entries[KEY+n])}catch{throw Error('슬롯 '+n+'의 저장 데이터가 손상되었습니다.')}
  if(!state||typeof state!=='object'||!Number.isInteger(state.day)||state.day<1||state.day>999||!['prep','open','closing'].includes(state.phase)||!Array.isArray(state.customRecipes))throw Error('슬롯 '+n+'의 게임 데이터 구조가 올바르지 않습니다.');
 }
 return {entries,keys,slots};
}
function mzTransferConfirm(info){
 const host=document.getElementById('modalRoot')?.querySelector('.drawer')||document.getElementById('bootOverlay');
 if(!host)throw Error('가져오기 창을 열 수 없습니다.');
 const mask=document.createElement('div');mask.className='mz-save-confirm-mask';mask.style.zIndex='99999';
 mask.innerHTML='<section class="mz-save-confirm" role="alertdialog" aria-modal="true" aria-label="백업 데이터 가져오기"><div class="mz-exit-kicker">SAVE TRANSFER</div><h3>저장 데이터를 가져올까요?</h3><p>백업 파일의 슬롯 '+info.slots.join(', ')+'과 설정을 복원합니다. 같은 번호의 현재 슬롯 및 설정은 덮어씁니다. 현재 진행 중인 미저장 내용은 옮겨지지 않습니다.</p><div class="mz-save-confirm-actions"><button type="button" class="btn primary" data-mz-import-confirm>가져오기</button><button type="button" class="btn" data-mz-import-cancel>취소</button></div><p data-mz-import-error role="alert"></p></section>';
 host.appendChild(mask);

  const original={};let written=[];
  try{
   for(const k of info.keys)original[k]=localStorage.getItem(k);
   for(const k of info.keys){localStorage.setItem(k,info.entries[k]);if(localStorage.getItem(k)!==info.entries[k])throw Error('저장 검증 실패');written.push(k)}
   mask.remove();
   // Reload to apply imported audio, visual and theme preferences consistently.
   alert('백업 데이터를 가져왔습니다. 게임을 새로고침하면 적용됩니다.');
   location.reload();
  }catch(e){for(const k of written){try{original[k]===null?localStorage.removeItem(k):localStorage.setItem(k,original[k])}catch{}}
   mask.querySelector('[data-mz-import-error]').textContent='저장 공간 또는 접근 권한 문제로 가져오지 못했습니다. 기존 데이터 복원을 시도했습니다.';
  }
 };
 mask.querySelector('[data-mz-import-cancel]').focus();
}
function mzImportBackup(file){
 if(!file)return;
 if(file.size>10*1024*1024){mzTransferStatus('백업 파일이 10MB를 초과합니다.',true);return;}
 const reader=new FileReader();reader.onerror=()=>mzTransferStatus('파일을 읽지 못했습니다.',true);
 reader.onload=()=>{try{const backup=JSON.parse(String(reader.result));const info=mzBackupValidate(backup);mzTransferConfirm(info)}catch(e){mzTransferStatus(e.message||'백업 파일을 읽지 못했습니다.',true)}};
 reader.readAsText(file,'UTF-8');
}

function saveSessionToSlot(slot){
 if(![1,2,3].includes(Number(slot)))return false;

  const payload=JSON.stringify({...snapshot,at:new Date().toLocaleString('ko-KR')});

 }catch(error){

 // Keep the user's volume separate from temporary transition attenuation.
 let targetVolume=audio.volume;
 let fadeToken=0, fading=false, fadeFrame=null, endWatch=null;
 const FADE_SECONDS=2.0;

   if(!Number.isFinite(duration)||duration<=0)return;

   if(remaining<=0||remaining>FADE_SECONDS)return;

(function u228CursorGlow(){
  function update(host,e){
    if(e.pointerType==='touch')return;
    const cards=host.querySelectorAll(':scope > .side, :scope > .boot-btn');
    for(const card of cards){
      const r=card.getBoundingClientRect();
      card.style.setProperty('--u228-x',(e.clientX-r.left).toFixed(1)+'px');
      card.style.setProperty('--u228-y',(e.clientY-r.top).toFixed(1)+'px');
    }
    host.classList.add('u228-active');
  }
  document.addEventListener('pointermove',e=>{
    const host=e.target.closest?.('.u228-host');
    if(host)update(host,e);
  },{passive:true});
  document.addEventListener('pointerout',e=>{
    const host=e.target.closest?.('.u228-host');
    if(host&&!host.contains(e.relatedTarget))host.classList.remove('u228-active');
  },{passive:true});
})();
